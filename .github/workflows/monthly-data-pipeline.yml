name: HealthTrend AI — Scheduled Data Pipeline
on:
  schedule:
    - cron: '17 3 10 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: healthtrend-monthly-data
  cancel-in-progress: false
jobs:
  ingest-mine-and-forecast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ETL and modelling dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Verify secure database credentials
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing repository secret SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing repository secret SUPABASE_SERVICE_ROLE_KEY" && exit 1)
      - name: Download and upsert official MMIS reports
        run: PYTHONPATH=. python scripts/ingest_mmis.py --push-supabase --output ../../data/processed/india_malaria_monthly_tpc_2023_2025.csv
      - name: Run descriptive data-mining pipeline
        run: PYTHONPATH=. python scripts/run_data_mining.py --csv ../data/processed/india_malaria_monthly_tpc_2023_2025.csv --target-name disease_cases --push-supabase
      - name: Compare forecasting models when data is sufficient
        shell: bash
        run: |
          ELIGIBLE=$(python - <<'PY'
          import pandas as pd
          frame = pd.read_csv('../data/processed/india_malaria_monthly_tpc_2023_2025.csv')
          dates = pd.to_datetime(frame['date'], errors='coerce').dt.to_period('M').dt.to_timestamp()
          contiguous = dates.notna().all() and not dates.duplicated().any() and len(pd.date_range(dates.min(), dates.max(), freq='MS')) == len(dates)
          print('yes' if len(frame) >= 36 and contiguous else 'no')
          PY
          )
          if [ "$ELIGIBLE" = "yes" ]; then
            PYTHONPATH=. python scripts/run_model_comparison.py --csv ../data/processed/india_malaria_monthly_tpc_2023_2025.csv --target-name disease_cases --push-supabase
          else
            echo "Forecast comparison skipped: at least 36 continuous monthly observations are required."
          fi
      - name: Commit refreshed public dataset
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/india_malaria_monthly_tpc_2023_2025.csv
          git diff --cached --quiet || git commit -m "data: refresh verified national malaria observations"
          git push
