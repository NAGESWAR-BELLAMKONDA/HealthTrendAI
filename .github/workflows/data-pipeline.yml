name: HealthTrend AI Data Pipeline
on:
  schedule:
    - cron: '20 3 15 * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: healthtrend-data-pipeline
  cancel-in-progress: false
jobs:
  ingest-and-mine:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-pipeline.txt
      - name: Install pipeline dependencies
        run: python -m pip install -r backend/requirements-pipeline.txt
      - name: Validate required server-side secrets
        run: |
          test -n "$SUPABASE_URL" || (echo "::error::Add SUPABASE_URL in repository Actions secrets" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "::error::Add SUPABASE_SERVICE_ROLE_KEY in repository Actions secrets" && exit 1)
      - name: Ingest official NCVBDC monthly reports
        working-directory: backend
        run: PYTHONPATH=. python scripts/ingest_mmis.py --push-supabase
      - name: Run descriptive mining and anomaly analysis
        working-directory: backend
        run: PYTHONPATH=. python scripts/run_data_mining.py --csv ../data/processed/india_malaria_monthly_tpc_2024_2025.csv --target-name disease_cases --push-supabase
