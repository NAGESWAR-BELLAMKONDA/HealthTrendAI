name: HealthTrend AI Data Pipeline
on:
  schedule:
    - cron: '20 3 15 * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: healthtrend-data-pipeline
  cancel-in-progress: false
jobs:
  ingest-and-mine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-pipeline.txt
      - name: Install pipeline dependencies
        run: python -m pip install -r backend/requirements-pipeline.txt
      - name: Validate required server-side secrets
        run: |
          test -n "$SUPABASE_URL" || (echo "::error::Add SUPABASE_URL in repository Actions secrets" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "::error::Add SUPABASE_SERVICE_ROLE_KEY in repository Actions secrets" && exit 1)
      - name: Ingest official NCVBDC monthly reports
        working-directory: backend
        run: PYTHONPATH=. python scripts/ingest_mmis.py --push-supabase
      - name: Run descriptive disease trend mining
        working-directory: backend
        run: PYTHONPATH=. python scripts/run_data_mining.py --csv ../data/processed/india_malaria_monthly_tpc_2024_2025.csv --target-name disease_cases --push-supabase
      - name: Run model comparison when the malaria series qualifies
        working-directory: backend
        run: |
          eligible=$(python - <<'PY'
          import pandas as pd
          from healthtrend.ingestion import validate_monthly_observations
          frame = validate_monthly_observations(pd.read_csv('../data/processed/india_malaria_monthly_tpc_2024_2025.csv'))
          dates = pd.to_datetime(frame['date'])
          contiguous = len(pd.date_range(dates.iloc[0], dates.iloc[-1], freq='MS')) == len(frame)
          print('yes' if len(frame) >= 36 and contiguous else 'no')
          PY
          )
          if [ "$eligible" = "yes" ]; then
            python -m pip install 'xgboost>=2.1,<4' 'prophet>=1.1,<2'
            PYTHONPATH=. python scripts/run_model_comparison.py --csv ../data/processed/india_malaria_monthly_tpc_2024_2025.csv --target-name disease_cases --push-supabase
          else
            echo "Model comparison skipped: need at least 36 continuous monthly observations; no gaps are imputed."
          fi
      - name: Process optional validated HMIS admissions file
        working-directory: backend
        run: |
          if [ -f ../data/processed/hmis_ipd_monthly.csv ]; then
            PYTHONPATH=. python scripts/run_data_mining.py --csv ../data/processed/hmis_ipd_monthly.csv --target-name hospital_admissions --push-supabase
            eligible=$(python - <<'PY'
          import pandas as pd
          from healthtrend.ingestion import validate_monthly_observations
          frame = validate_monthly_observations(pd.read_csv('../data/processed/hmis_ipd_monthly.csv'))
          dates = pd.to_datetime(frame['date'])
          print('yes' if len(frame) >= 36 and len(pd.date_range(dates.iloc[0], dates.iloc[-1], freq='MS')) == len(frame) else 'no')
          PY
            )
            if [ "$eligible" = "yes" ]; then
              python -m pip install 'xgboost>=2.1,<4' 'prophet>=1.1,<2'
              PYTHONPATH=. python scripts/run_model_comparison.py --csv ../data/processed/hmis_ipd_monthly.csv --target-name hospital_admissions --push-supabase
            else
              echo "HMIS model comparison skipped: need 36 continuous months."
            fi
          else
            echo "No validated HMIS admissions CSV present. Admissions remain unpopulated."
          fi
      - name: Upload pipeline outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthtrend-pipeline-outputs
          path: |
            data/processed/*.csv
            backend/mining_results.json
          if-no-files-found: warn
          retention-days: 30
